<style type="text/tailwindcss">

<style>
:root {
  --page: #EFE9E1;
  --shadow-card: 0 1px 2px rgb(46 42 38 / .04), 0 8px 24px rgb(46 42 38 / .05);
  --wash-from: #EEF3EC;

  --btn-bg: #5E7B62;
  --btn-ink: #FFFDFA;
  --on-accent: #FFFDFA;
  --backdrop: rgb(46 42 38 / .35);
  --toast-act: #BFD6C2;
  --bad-ink: color-mix(in oklab, #C27A63 62%, #2E2A26);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #1F1C19;
    --color-surface: #2A2622;
    --color-surface-2: #35302B;
    --color-line: #3F3933;
    --color-ink: #F3EDE6;
    --color-ink-2: #C7BDB2;
    --color-ink-3: #9C9287;
    --color-accent-ink: #A9C3AC;
    --page: #171513;
    --shadow-card: 0 1px 2px rgb(0 0 0 / .25), 0 8px 24px rgb(0 0 0 / .25);
    --wash-from: #2C332D;
    --wash-to: #3A2F2B;
    --btn-bg: #7F9A82;
    --btn-ink: #1F1C19;
    --on-accent: #1F1C19;
    --backdrop: rgb(0 0 0 / .55);
    --toast-act: #3F5A43;
    --bad-ink: color-mix(in oklab, #C27A63 62%, #F3EDE6);
  }
}
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--color-ink);
  font-family: var(--font-sans); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button[disabled] { cursor: default; }
:focus-visible { outline: 2px solid var(--color-accent-ink); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { max-width: 460px; margin: 0 auto; min-height: 100dvh; background: var(--color-bg); position: relative; }
@media (min-width: 768px) { #app { box-shadow: 0 0 0 1px rgb(46 42 38 / .05), 0 20px 60px rgb(46 42 38 / .12); } }

.hdr { display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-top) + 10px) 20px 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-accent); flex: none; margin-left: 4px; }
.dot[data-s="connecting"], .dot[data-s="reconnecting"] { background: var(--color-warn); }
.dot[data-s="offline"] { background: var(--color-cat-misc); }
.avatar-btn { width: 48px; height: 48px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; }
.avatar { width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: var(--c, var(--color-pa)); color: #2E2A26; font-family: var(--font-serif); font-weight: 600; font-size: 18px; }

.card { background: var(--color-surface); border-radius: var(--radius-card); padding: 20px; box-shadow: var(--shadow-card); }
.card.wash { background: linear-gradient(135deg, var(--wash-from) 0%, var(--wash-to) 100%); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 13px; color: var(--color-ink-2); }
.cap { font-size: 13px; color: var(--color-ink-2); }
.serif { font-family: var(--font-serif); }
.h1 { font-family: var(--font-serif); font-size: 26px; font-weight: 500; line-height: 1.15; margin: 0; }
.h2 { font-family: var(--font-serif); font-size: 22px; font-weight: 500; line-height: 1.2; margin: 0; }
.hero { font-family: var(--font-serif); font-size: 44px; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; margin: 4px 0 2px; }
.tnum { font-variant-numeric: tabular-nums; }
.neg { color: var(--bad-ink); }
.pos { color: var(--color-accent-ink); }
.day { font-size: 13px; color: var(--color-ink-2); margin: 6px 4px 8px; font-weight: 600; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 56px; border-radius: 999px; background: var(--btn-bg); color: var(--btn-ink); font-weight: 600; font-size: 16px; transition: transform .15s, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .6; }
.btn.soft { background: var(--color-surface-2); color: var(--color-ink); }
.btn.sm { width: auto; min-height: 48px; padding: 0 20px; font-size: 15px; }
.btn.link { width: auto; background: none; color: var(--color-accent-ink); min-height: 48px; padding: 0 12px; font-size: 15px; }
.iconbtn { width: 48px; height: 48px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; color: var(--color-ink-2); flex: none; }
.iconbtn[disabled] { opacity: .3; }
.iconbtn.faint { color: var(--color-ink-3); }

.lbl { display: block; font-size: 14px; color: var(--color-ink-2); margin: 0 0 6px 4px; }
.input { display: block; width: 100%; min-height: 52px; border-radius: 1rem; background: var(--color-surface-2); color: var(--color-ink); border: 2px solid transparent; padding: 0 16px; font-size: 16px; box-sizing: border-box; min-width: 0; -webkit-appearance: none; appearance: none; }
textarea.input { padding: 12px 16px; resize: none; line-height: 1.4; }
.input:focus { outline: none; border-color: var(--color-accent); }
.input::placeholder { color: var(--color-ink-3); }
.err { color: var(--bad-ink); font-size: 14px; margin: 8px 4px 0; }
.err:empty { display: none; }
.form { display: flex; flex-direction: column; gap: 14px; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 999px; background: var(--color-surface-2); }
.seg button { min-height: 48px; border-radius: 999px; font-weight: 600; color: var(--color-ink-2); padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button.on { background: var(--color-surface); color: var(--color-ink); box-shadow: 0 1px 3px rgb(46 42 38 / .12); }
.seg button.on[data-p] { background: color-mix(in oklab, var(--c) 38%, var(--color-surface)); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -20px; padding: 2px 20px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 48px; padding: 0 16px; border-radius: 999px; background: var(--color-surface-2); display: inline-flex; align-items: center; gap: 8px; border: 2px solid transparent; font-weight: 500; color: var(--color-ink); }
.chip[aria-pressed="true"] { background: color-mix(in oklab, var(--c) 35%, var(--color-surface)); border-color: var(--c); }

.ico-chip { width: 44px; height: 44px; flex: none; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in oklab, var(--c) 22%, transparent); color: color-mix(in oklab, var(--c) 70%, var(--color-ink)); }
.row { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.list > .row + .row { border-top: 1px solid color-mix(in oklab, var(--color-line) 60%, transparent); }
.list.card { padding: 6px 12px 6px 16px; }
.grow { flex: 1; min-width: 0; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: color-mix(in oklab, var(--color-accent) 24%, transparent); color: var(--color-accent-ink); margin-left: 6px; font-weight: 600; vertical-align: 1px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: color-mix(in oklab, var(--color-surface) 65%, transparent); font-size: 14px; }
.pdot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

.bar { height: 10px; border-radius: 999px; background: var(--color-line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--c, var(--color-accent)); transition: width .4s ease-out; }
.bar.warn > i { background: var(--color-warn); }
.bar.over > i { background: var(--color-bad); }

.act-ico { width: 40px; height: 40px; border-radius: 999px; background: var(--color-surface-2); color: var(--color-ink-2); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; padding: 0 16px; border-radius: 1rem; background: var(--color-surface-2); text-align: left; }
.switch { width: 52px; height: 32px; border-radius: 999px; background: var(--color-line); position: relative; flex: none; transition: background .2s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .2s; }
[aria-checked="true"] > .switch { background: var(--color-accent); }
[aria-checked="true"] > .switch i { transform: translateX(20px); }

.amount-wrap { display: flex; align-items: center; gap: 6px; min-height: 76px; padding: 0 20px; border-radius: 1.25rem; background: var(--color-surface-2); border: 2px solid transparent; }
.amount-wrap:focus-within { border-color: var(--color-accent); }
.amount-wrap .cur { font-family: var(--font-serif); font-size: 36px; color: var(--color-ink-2); }
.amount-input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-family: var(--font-serif); font-size: 36px; font-weight: 500; font-variant-numeric: tabular-nums; min-height: 72px; padding: 0; color: var(--color-ink); }
.amount-input::placeholder { color: var(--color-ink-3); }
.amt-field { display: flex; align-items: center; gap: 6px; width: 132px; flex: none; }
.amt-field .cur { color: var(--color-ink-2); }
.amt-field .input { text-align: right; padding: 0 12px; }

.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 460px; z-index: 20; background: color-mix(in oklab, var(--color-surface) 85%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 1px solid var(--color-line); padding: 6px 8px calc(var(--safe-bottom) + 6px); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--color-ink-2); border-radius: 14px; }
.tab[aria-current="page"] { color: var(--color-accent-ink); font-weight: 600; }
.fab { width: 60px; height: 60px; border-radius: 999px; background: var(--color-accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; margin: -30px auto 0; box-shadow: 0 8px 20px color-mix(in oklab, var(--color-accent) 55%, transparent); transition: transform .15s; }
.fab:active { transform: scale(.94); }

#sheet-root { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; transition: opacity .3s; }
.sheet { position: absolute; left: 50%; bottom: 0; width: 100%; max-width: 460px; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--color-surface); border-radius: 28px 28px 0 0; transform: translate(-50%, 100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); padding-bottom: calc(var(--safe-bottom) + 12px); }
#sheet-root.open .sheet-backdrop { opacity: 1; }
#sheet-root.open .sheet { transform: translate(-50%, 0); }
.sheet-grab { position: relative; display: flex; justify-content: center; align-items: center; height: 48px; touch-action: none; cursor: grab; }
.grab-handle { width: 40px; height: 5px; border-radius: 999px; background: var(--color-line); }
.sheet-x { position: absolute; right: 8px; top: 0; }

#toast { position: fixed; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 96px); display: flex; justify-content: center; z-index: 60; pointer-events: none; padding: 0 16px; }
.toast-pill { pointer-events: auto; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 8px 0 20px; border-radius: 999px; background: var(--color-ink); color: var(--color-bg); font-size: 15px; box-shadow: 0 8px 24px rgb(0 0 0 / .25); animation: toast-in .25s ease-out; max-width: 100%; }
.toast-pill.last { padding-right: 20px; }
.toast-btn { min-height: 48px; min-width: 48px; padding: 0 14px; border-radius: 999px; font-weight: 700; color: var(--toast-act); }
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.setup { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 24px); box-sizing: border-box; }
.setup-card { width: 100%; }
.brand { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 18px; color: var(--color-accent-ink); }
.brand span.name { font-family: var(--font-serif); font-size: 32px; font-weight: 600; color: var(--color-ink); }
.sql { max-height: 220px; overflow: auto; margin: 0; background: var(--color-surface-2); border-radius: 1rem; padding: 14px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; color: var(--color-ink); }
.steps { margin: 10px 0 0; padding-left: 20px; color: var(--color-ink-2); font-size: 15px; }
.steps li { margin-bottom: 4px; }
.sdet { background: var(--color-surface-2); border-radius: 1rem; padding: 0 14px 14px; }
.sdet > summary { display: flex; align-items: center; min-height: 48px; font-weight: 600; cursor: pointer; }
.amt-field.bud { width: 116px; }
.badge.lead { margin: 0 6px 0 0; }
.empty { text-align: center; padding: 28px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; color: var(--color-ink-2); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

<script>
(function (root) {
  'use strict';

  var CATEGORIES = [
    { key: 'groceries', label: 'Groceries' },
    { key: 'dining', label: 'Dining Out' },
    { key: 'utilities', label: 'Utilities' },
    { key: 'transport', label: 'Transport' },
    { key: 'entertainment', label: 'Entertainment' },
    { key: 'misc', label: 'Miscellaneous' }
  ];
  var CATEGORY_LABEL = {};
  CATEGORIES.forEach(function (c) { CATEGORY_LABEL[c.key] = c.label; });

  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MINUS = '−';

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function parseIso(iso) {
    var p = String(iso).split('-');
    return { y: +p[0], m: +p[1], d: +p[2] };
  }

  function utcNoon(iso) {
    var p = parseIso(iso);
    return Date.UTC(p.y, p.m - 1, p.d, 12);
  }

  function isoFromUtc(ms) {
    var dt = new Date(ms);
    return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate());
  }

  function round2(n) { return Math.round((n + Number.EPSILON) * 100) / 100; }

  function todayISO(now) {
    var d = now || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function addDays(iso, n) { return isoFromUtc(utcNoon(iso) + n * 86400000); }

  function daysBetween(aIso, bIso) { return Math.round((utcNoon(bIso) - utcNoon(aIso)) / 86400000); }

  function monthStart(iso) { return iso.slice(0, 7) + '-01'; }

  function lastDayOfMonth(iso) {
    var p = parseIso(iso);
    return isoFromUtc(Date.UTC(p.y, p.m, 0, 12));
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  var numberFormat = new Intl.NumberFormat('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function fmtMoney(amount, currency) {
    var sym = currency === undefined || currency === null ? '€' : String(currency);
    var n = Number(amount);
    if (!isFinite(n)) n = 0;
    var body = numberFormat.format(Math.abs(n));
    var negative = n < 0 && /[1-9]/.test(body);
    return (negative ? MINUS : '') + sym + body;
  }

  function fmtDate(iso, today) {
    var p = parseIso(iso);
    var t = today || todayISO();
    var wd = WEEKDAYS[new Date(utcNoon(iso)).getUTCDay()];
    var out = wd + ' ' + p.d + ' ' + MONTHS[p.m - 1];
    if (p.y !== parseIso(t).y) out += ' ' + p.y;
    return out;
  }

  function fmtDayMonth(iso, today) {
    var p = parseIso(iso);
    var out = p.d + ' ' + MONTHS[p.m - 1];
    if (p.y !== parseIso(today || todayISO()).y) out += ' ' + p.y;
    return out;
  }

  function fmtCycleRange(cycle, today) {
    var end = cycle.end ? fmtDayMonth(cycle.end, today) : 'today';
    return fmtDayMonth(cycle.start, today) + ' – ' + end;
  }

  function fmtRelative(ts, now) {
    var n = now || new Date();
    var then = ts instanceof Date ? ts : new Date(ts);
    if (isNaN(then.getTime())) return '';
    var diffSec = Math.floor((n.getTime() - then.getTime()) / 1000);
    if (diffSec < 60) return 'just now';
    var mins = Math.floor(diffSec / 60);
    if (mins < 60) return mins + ' min ago';
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + ' h ago';
    var today = todayISO(n);
    var day = todayISO(then);
    if (day === addDays(today, -1)) return 'yesterday';
    return fmtDate(day, today);
  }

  function validGrouping(str, sep) {
    var parts = str.split(sep);
    if (!/^[0-9]{1,3}$/.test(parts[0])) return false;
    for (var i = 1; i < parts.length; i++) {
      if (!/^[0-9]{3}$/.test(parts[i])) return false;
    }
    return true;
  }

  function parseAmount(input) {
    if (typeof input === 'number') return isFinite(input) && input >= 0 ? round2(input) : NaN;
    if (input === null || input === undefined) return NaN;
    var s = String(input);
    if (/[-−–]/.test(s)) return NaN;
    s = s.replace(/[^0-9.,]/g, '');
    if (!/[0-9]/.test(s)) return NaN;
    var lastDot = s.lastIndexOf('.');
    var lastComma = s.lastIndexOf(',');
    var dots = (s.match(/\./g) || []).length;
    var commas = (s.match(/,/g) || []).length;
    var intPart;
    var frac = '';

  function cleanName(value) {
    var name = typeof value === 'string' ? value.trim() : '';
    if (name.length < 1 || Array.from(name).length > 24) {
      throw fail('VALIDATION', 'Names must be between 1 and 24 characters.');
    }
    return name;
  }

  function cleanText(value, max, fallback, tooLong) {
    var text = typeof value === 'string' ? value.trim() : '';
    if (!text) return fallback;
    if (Array.from(text).length > max) throw fail('VALIDATION', tooLong);
    return text;
  }

  function redirectUrl() {
    return root.location.origin + String(root.location.pathname).replace(/index\.html$/, '');
  }

  function sessionSummary(session) {
    if (!session || !session.user) return null;
    return { userId: session.user.id, email: session.user.email || '' };
  }

  async function currentUserId() {
    var res = await call(requireClient().auth.getSession());
    var session = res.data && res.data.session;
    if (!session || !session.user) throw fail('AUTH', 'Please sign in to continue.');
    return session.user.id;
  }

  async function fetchPaged(makeQuery) {
    var rows = [];
    var from = 0;
    for (;;) {
      var res = await call(makeQuery().range(from, from + PAGE_SIZE - 1));
      var page = res.data || [];
      rows = rows.concat(page);
      if (page.length < PAGE_SIZE) return rows;
      from += PAGE_SIZE;
    }
  }

  async function insertRow(table, fields, payload, normalise) {
    try {
      var res = await call(requireClient().from(table).insert(payload).select(fields.join(',')).single());
      return normalise(res.data);
    } catch (e) {
      if (e && e.pgCode === '23505' && payload.id) {
        var existing = await call(requireClient().from(table).select(fields.join(',')).eq('id', payload.id).maybeSingle());
        if (existing.data) return normalise(existing.data);
      }
      throw e;
    }
  }

  async function setDeletedAt(table, fields, normalise, id, value) {
    cleanId(id);
    var q = requireClient().from(table).update({ deleted_at: value }).eq('id', id);
    q = value === null ? q.not('deleted_at', 'is', null) : q.is('deleted_at', null);
    var res = await call(q.select(fields.join(',')));
    var rows = res.data || [];
    if (!rows.length) {
      var cur = await call(requireClient().from(table).select(fields.join(',')).eq('id', id).maybeSingle());
      if (cur.data && (value === null ? !cur.data.deleted_at : Boolean(cur.data.deleted_at))) {
        return normalise(cur.data);
      }
      throw fail('NOT_MEMBER', "That entry couldn't be updated. It may have been removed, or you may not be part of this household.");
    }
    return normalise(rows[0]);
  }

  /* ───────────── auth event hub ───────────── */

  function attachAuthHub() {
    var sub = client.auth.onAuthStateChange(function (event, session) {
      if (event === 'TOKEN_REFRESHED' && session && session.access_token) {
        try { client.realtime.setAuth(session.access_token); } catch (e) { /* realtime not ready yet */ }
      }
      if (event === 'PASSWORD_RECOVERY') recoveryPending = sessionSummary(session);
      if (event === 'SIGNED_OUT') recoveryPending = null;
      if (!FORWARDED_AUTH_EVENTS[event]) return;
      var summary = sessionSummary(session);
      var listeners = authListeners.slice();
      setTimeout(function () {
        for (var i = 0; i < listeners.length; i++) {
          try { listeners[i](event, summary); } catch (e) { /* a listener failure must not affect others */ }
        }
      }, 0);
    });
    authSubscription = sub && sub.data ? sub.data.subscription : null;
  }

  /* ───────────── realtime ───────────── */

  function emitStatus(state, status) {
    if (state.stopped || typeof state.handlers.onStatus !== 'function') return;
    try { state.handlers.onStatus(status); } catch (e) { /* UI handler failure must not break sync */ }
  }

  function dispatchChange(state, table, payload) {
    var h = state.handlers;
    var type = payload && payload.eventType;
    var row = payload && payload.new;
    if (!row || (type !== 'INSERT' && type !== 'UPDATE')) return;
    var handler = null;
    var value = null;
    switch (table) {
      case 'expenses': handler = h.onExpense; value = normExpense(row); break;
      case 'incomes': handler = h.onIncome; value = normIncome(row); break;
      case 'budgets': handler = h.onBudget; value = normBudget(row); break;
      case 'household': handler = h.onHousehold; value = normHousehold(row); break;
      case 'members': handler = h.onMember; value = normMember(row); break;
      case 'activity_log':
        if (type === 'INSERT') { handler = h.onActivity; value = normActivity(row); }
        break;
      default: break;
    }
    if (typeof handler !== 'function') return;
    try { handler(value); } catch (e) { /* UI handler failure must not break sync */ }
  }

  async function disposeChannel(state) {
    var att = state.att;
    state.att = null;
    if (!att) return;
    att.dead = true;
    if (att.channel && client) {
      try { await withTimeout(client.removeChannel(att.channel)); } catch (e) { /* channel already gone */ }
    }
  }

  function scheduleRetry(state) {
    if (state.stopped || state.retryTimer) return;
    var delay = Math.min(MAX_BACKOFF_MS, 1000 * Math.pow(2, state.attempt));
    state.attempt += 1;
    state.retryTimer = setTimeout(function () {
      state.retryTimer = null;
      openChannel(state);
    }, delay);
  }

  async function openChannel(state) {
    if (state.stopped || !client) return;
    var gen = ++state.gen;
    var c = client;
    await disposeChannel(state);
    if (state.stopped || gen !== state.gen) return;

    var token = null;
    try {
      var res = await withTimeout(c.auth.getSession());
      token = res && res.data && res.data.session ? res.data.session.access_token : null;
    } catch (e) {
      token = null;
    }
    if (state.stopped || gen !== state.gen) return;
    if (!token) {
      emitStatus(state, 'reconnecting');
      scheduleRetry(state);
      return;
    }

    c.realtime.setAuth(token);
    var att = { dead: false, channel: null };
    state.att = att;
    var channel = c.channel(CHANNEL_NAME);
    att.channel = channel;
    ['expenses', 'incomes', 'budgets', 'household', 'members', 'activity_log'].forEach(function (table) {
      channel.on('postgres_changes', { event: '*', schema: 'public', table: table }, function (payload) {
        if (att.dead || state.stopped) return;
        dispatchChange(state, table, payload);
      });
    });
    channel.subscribe(function (status) {
      if (att.dead || state.stopped) return;
      if (status === 'SUBSCRIBED') {
        state.attempt = 0;
        emitStatus(state, 'live');
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        emitStatus(state, 'reconnecting');
        scheduleRetry(state);
      }
    });
  }

  function stopSubscription(state) {
    if (state.stopped) return;
    state.stopped = true;
    if (state.retryTimer) {
      clearTimeout(state.retryTimer);
      state.retryTimer = null;
    }
    root.removeEventListener('online', state.onOnline);
    root.removeEventListener('offline', state.onOffline);
    if (active === state) active = null;
    return disposeChannel(state);
  }

  /* ───────────── public API ───────────── */

  var DuoStore = {
    /**
     * Creates the Supabase client. Replaces any existing client.
     * @param {{url:string, anonKey:string}} config
     * @returns {Promise<void>}
     */
    connect: async function (config) {
      var url = config && typeof config.url === 'string' ? config.url.trim() : '';
      var anonKey = config && typeof config.anonKey === 'string' ? config.anonKey.trim() : '';
      if (url.indexOf('https://') !== 0 || url.length <= 'https://'.length) {
        throw fail('VALIDATION', 'The project URL must start with https://');
      }
      if (!anonKey) throw fail('VALIDATION', 'Paste your Supabase anon key.');
      if (!root.supabase || typeof root.supabase.createClient !== 'function') {
        throw fail('NETWORK', "The Supabase library didn't load. Check your connection and reload the page.");
      }
      await DuoStore.disconnect();
      try {
        client = root.supabase.createClient(url, anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
      } catch (e) {
        client = null;
        throw fail('VALIDATION', "Those database details couldn't be used. Check the URL and key.");
      }
      lastConfig = { url: url, anonKey: anonKey };
      attachAuthHub();
    },

    /**
     * Verifies the setup SQL has been run by calling household_status().
     * @returns {Promise<boolean>} true when the schema is present.
     */
    checkSchema: async function () {
      try {
        await call(requireClient().rpc('household_status'));
      } catch (e) {
        if (e instanceof DuoError && e.pgCode === '42501') {
          throw withPgCode(fail('SCHEMA', "The database isn't set up yet \u2014 run the setup SQL."), '42501');
        }
        throw e;
      }
      return true;
    },

    /**
     * Returns the current signed-in user, if any.
     * @returns {Promise<{userId:string, email:string}|null>}
     */
    getSession: async function () {
      var res = await call(requireClient().auth.getSession());
      return sessionSummary(res.data && res.data.session);
    },

    /**
     * Creates an account.
     * @param {{email:string, password:string}} credentials
     * @returns {Promise<{needsConfirmation:boolean}>}
     */
    signUp: async function (credentials) {
      var email = credentials && typeof credentials.email === 'string' ? credentials.email.trim() : '';
      var password = credentials && typeof credentials.password === 'string' ? credentials.password : '';
      if (!email) throw fail('VALIDATION', 'Enter your email address.');
      if (password.length < 8) throw fail('VALIDATION', 'Passwords need at least 8 characters.');
      var res = await call(requireClient().auth.signUp({
        email: email,
        password: password,
        options: { emailRedirectTo: redirectUrl() }
      }));
      var user = res.data && res.data.user;
      if (user && Array.isArray(user.identities) && user.identities.length === 0) throw fail('USER_EXISTS');
      return { needsConfirmation: !(res.data && res.data.session) };
    },

    /**
     * Signs in with email and password.
     * @param {{email:string, password:string}} credentials
     * @returns {Promise<{userId:string, email:string}>}
     */
    signIn: async function (credentials) {
      var email = credentials && typeof credentials.email === 'string' ? credentials.email.trim() : '';
      var password = credentials && typeof credentials.password === 'string' ? credentials.password : '';
      if (!email || !password) throw fail('VALIDATION', 'Enter your email and password.');
      var res = await call(requireClient().auth.signInWithPassword({ email: email, password: password }));
      var user = res.data && res.data.user;
      if (!user) throw fail('UNKNOWN');
      return { userId: user.id, email: user.email || email };
    },

    /**
     * Signs out on this device.
     * @returns {Promise<void>}
     */
    signOut: async function () {
      var c = requireClient();
      try {
        await call(c.auth.signOut({ scope: 'local' }));
      } catch (e) {
        if (!(e instanceof DuoError) || e.code !== 'AUTH') {
          // Offline or failing server: drop the local session anyway.
          try {
            var ls = root.localStorage;
            var doomed = [];
            for (var i = 0; i < ls.length; i++) {
              var k = ls.key(i);
              if (k && /^sb-.*-auth-token$/.test(k)) doomed.push(k);
            }
            doomed.forEach(function (k) { ls.removeItem(k); });
          } catch (e2) { /* storage unavailable */ }
          var cfg = lastConfig;
          await DuoStore.disconnect();
          if (cfg) await DuoStore.connect(cfg);
        }
      }
      recoveryPending = null;
    },

    /**
     * Emails a password reset link that returns to this page.
     * @param {string} email
     * @returns {Promise<void>}
     */
    requestPasswordReset: async function (email) {
      var address = typeof email === 'string' ? email.trim() : '';
      if (!address) throw fail('VALIDATION', 'Enter your email address.');
      await call(requireClient().auth.resetPasswordForEmail(address, { redirectTo: redirectUrl() }));
    },

    /**
     * Sets a new password for the signed-in (or recovering) user.
     * @param {string} newPassword At least 8 characters.
     * @returns {Promise<void>}
     */
    updatePassword: async function (newPassword) {
      if (typeof newPassword !== 'string' || newPassword.length < 8) {
        throw fail('VALIDATION', 'Passwords need at least 8 characters.');
      }
      await call(requireClient().auth.updateUser({ password: newPassword }));
      recoveryPending = null;
    },

    /**
     * Listens for SIGNED_IN, SIGNED_OUT, PASSWORD_RECOVERY and TOKEN_REFRESHED.
     * A password-recovery event that happened before registration is replayed once.
     * @param {function(string, {userId:string, email:string}|null):void} cb
     * @returns {function():void} Unsubscribe function.
     */
    onAuthChange: function (cb) {
      if (typeof cb !== 'function') throw fail('VALIDATION', 'A callback is required.');
      authListeners.push(cb);
      if (recoveryPending) {
        var pending = recoveryPending;
        setTimeout(function () {
          if (authListeners.indexOf(cb) !== -1) {
            try { cb('PASSWORD_RECOVERY', pending); } catch (e) { /* listener failure is isolated */ }
          }
        }, 0);
      }
      return function () {
        var index = authListeners.indexOf(cb);
        if (index !== -1) authListeners.splice(index, 1);
      };
    },

    /**
     * Reports whether the household exists and the caller's place in it.
     * @returns {Promise<{exists:boolean, member_count:number, my_slot:('A'|'B'|null)}>}
     */
    householdStatus: async function () {
      var res = await call(requireClient().rpc('household_status'));
      var d = res.data || {};
      return {
        exists: Boolean(d.exists),
        member_count: Number(d.member_count) || 0,
        my_slot: d.my_slot === 'A' || d.my_slot === 'B' ? d.my_slot : null
      };
    },

    /**
     * Creates the household and makes the caller partner A.
     * @param {{passphrase:string, displayName:string, currency:string}} input
     * @returns {Promise<'A'>}
     */
    createHousehold: async function (input) {
      var passphrase = input && typeof input.passphrase === 'string' ? input.passphrase : '';
      if (passphrase.length < 8) {
        throw fail('VALIDATION', 'The household passphrase must be at least 8 characters.');
      }
      var name = cleanName(input && input.displayName);
      var currency = cleanText(input && input.currency, 4, '€', 'The currency symbol can be at most 4 characters.');
      var res = await call(requireClient().rpc('create_household', {
        p_passphrase: passphrase,
        p_display_name: name,
        p_currency: currency
      }));
      return res.data === 'B' ? 'B' : 'A';
    },

    /**
     * Joins the household with its passphrase.
     * @param {{passphrase:string, displayName:string}} input
     * @returns {Promise<'A'|'B'>}
     */
    joinHousehold: async function (input) {
      var passphrase = input && typeof input.passphrase === 'string' ? input.passphrase : '';
      if (!passphrase) throw fail('VALIDATION', 'Enter the household passphrase.');
      var name = cleanName(input && input.displayName);
      var res = await call(requireClient().rpc('join_household', {
        p_passphrase: passphrase,
        p_display_name: name
      }));
      if (res.data === 'DUO_WRONG_PASSPHRASE') throw fail('WRONG_PASSPHRASE');
      if (res.data !== 'A' && res.data !== 'B') throw fail('UNKNOWN');
      return res.data;
    },

    /**
     * Loads everything the app needs in one go.
     * @param {{sinceDate?:string}} [options] Only expenses/incomes dated on or after this 'YYYY-MM-DD' are returned.
     * @returns {Promise<{members:Array, household:Object, expenses:Array, incomes:Array, budgetRows:Array, activity:Array}>}
     */
    loadAll: async function (options) {
      var c = requireClient();
      var since = options && options.sinceDate;
      if (since !== undefined && since !== null && !isISODate(since)) {
        throw fail('VALIDATION', 'The history start date must look like 2026-01-31.');
      }
      var results = await Promise.all([
        call(c.from('members').select(MEMBER_FIELDS.join(',')).order('slot', { ascending: true })),
        call(c.from('household').select(HOUSEHOLD_FIELDS.join(',')).eq('id', 1).maybeSingle()),
        fetchPaged(function () {
          var q = c.from('expenses').select(EXPENSE_FIELDS.join(','));
          if (since) q = q.gte('spent_on', since);
          return q.order('spent_on', { ascending: false }).order('created_at', { ascending: false }).order('id', { ascending: false });
        }),
        fetchPaged(function () {
          var q = c.from('incomes').select(INCOME_FIELDS.join(','));
          if (since) q = q.gte('received_on', since);
          return q.order('received_on', { ascending: false }).order('created_at', { ascending: false }).order('id', { ascending: false });
        }),
        fetchPaged(function () {
          return c.from('budgets').select(BUDGET_FIELDS.join(','))
            .order('effective_from', { ascending: true }).order('category', { ascending: true });
        }),
        call(c.from('activity_log').select(ACTIVITY_FIELDS.join(','))
          .order('at', { ascending: false }).order('id', { ascending: false }).limit(200))
      ]);
      var householdRow = results[1].data;
      if (!householdRow) {
        throw fail('NOT_MEMBER', "We couldn't load your household. Make sure you have joined it.");
      }
      return {
        members: (results[0].data || []).map(normMember),
        household: normHousehold(householdRow),
        expenses: results[2].map(normExpense),
        incomes: results[3].map(normIncome),
        budgetRows: results[4].map(normBudget),
        activity: (results[5].data || []).map(normActivity)
      };
    },

    /**
     * Adds an expense (the client supplies the id).
     * @param {{id:string, amount:number, category:string, description:string, spent_on:string, paid_by:'A'|'B'}} e
     * @returns {Promise<Object>} The stored Expense.
     */
    addExpense: async function (e) {
      if (!e || CATEGORY_KEYS.indexOf(e.category) === -1) throw fail('VALIDATION', 'Choose a category.');
      if (!isISODate(e.spent_on)) throw fail('VALIDATION', 'Choose a valid date.');
      var payload = {
        amount: cleanMoney(e.amount, false),
        category: e.category,
        description: cleanText(e.description, 140, '', 'Descriptions can be at most 140 characters.'),
        spent_on: e.spent_on,
        paid_by: cleanSlot(e.paid_by, 'paid')
      };
      if (typeof e.id === 'string' && e.id) payload.id = e.id;
      return insertRow('expenses', EXPENSE_FIELDS, payload, normExpense);
    },

    /**
     * Soft-deletes an expense.
     * @param {string} id
     * @returns {Promise<Object>} The updated Expense.
     */
    deleteExpense: function (id) {
      return setDeletedAt('expenses', EXPENSE_FIELDS, normExpense, id, new Date().toISOString());
    },

    /**
     * Restores a soft-deleted expense.
     * @param {string} id
     * @returns {Promise<Object>} The updated Expense.
     */
    restoreExpense: function (id) {
      return setDeletedAt('expenses', EXPENSE_FIELDS, normExpense, id, null);
    },

    /**
     * Adds an income (the client supplies the id).
     * @param {{id:string, amount:number, earner:'A'|'B', label:string, received_on:string, starts_cycle:boolean}} i
     * @returns {Promise<Object>} The stored Income.
     */
    addIncome: async function (i) {
      if (!i || !isISODate(i.received_on)) throw fail('VALIDATION', 'Choose a valid date.');
      var payload = {
        amount: cleanMoney(i.amount, false),
        earner: cleanSlot(i.earner, 'earned it'),
        label: cleanText(i.label, 40, 'Salary', 'Labels can be at most 40 characters.'),
        received_on: i.received_on,
        starts_cycle: Boolean(i.starts_cycle)
      };
      if (typeof i.id === 'string' && i.id) payload.id = i.id;
      return insertRow('incomes', INCOME_FIELDS, payload, normIncome);
    },

    /**
     * Soft-deletes an income.
     * @param {string} id
     * @returns {Promise<Object>} The updated Income.
     */
    deleteIncome: function (id) {
      return setDeletedAt('incomes', INCOME_FIELDS, normIncome, id, new Date().toISOString());
    },

    /**
     * Restores a soft-deleted income.
     * @param {string} id
     * @returns {Promise<Object>} The updated Income.
     */
    restoreIncome: function (id) {
      return setDeletedAt('incomes', INCOME_FIELDS, normIncome, id, null);
    },

    /**
     * Sets a category budget from a cycle start date (upsert on category + effective_from).
     * @param {{category:string, effectiveFrom:string, amount:number}} input
     * @returns {Promise<Object>} The stored BudgetRow.
     */
    setBudget: async function (input) {
      if (!input || CATEGORY_KEYS.indexOf(input.category) === -1) throw fail('VALIDATION', 'Choose a category.');
      if (!isISODate(input.effectiveFrom)) throw fail('VALIDATION', 'Choose a valid start date.');
      var row = {
        category: input.category,
        effective_from: input.effectiveFrom,
        amount: cleanMoney(input.amount, true)
      };
      var res = await call(requireClient().from('budgets')
        .upsert(row, { onConflict: 'category,effective_from' })
        .select(BUDGET_FIELDS.join(',')).single());
      return normBudget(res.data);
    },

    /**
     * Updates household settings.
     * @param {{currency?:string, cycle_starter?:'A'|'B'|'any'}} patch
     * @returns {Promise<Object>} The updated Household.
     */
    updateHousehold: async function (patch) {
      var update = {};
      if (patch && patch.currency !== undefined) {
        update.currency = cleanText(patch.currency, 4, '', 'The currency symbol can be at most 4 characters.');
        if (!update.currency) throw fail('VALIDATION', 'Enter a currency symbol.');
      }
      if (patch && patch.cycle_starter !== undefined) {
        if (patch.cycle_starter !== 'A' && patch.cycle_starter !== 'B' && patch.cycle_starter !== 'any') {
          throw fail('VALIDATION', 'Choose who starts the budget cycle.');
        }
        update.cycle_starter = patch.cycle_starter;
      }
      if (!Object.keys(update).length) throw fail('VALIDATION', 'There is nothing to change.');
      var res = await call(requireClient().from('household').update(update).eq('id', 1)
        .select(HOUSEHOLD_FIELDS.join(',')));
      var rows = res.data || [];
      if (!rows.length) throw fail('NOT_MEMBER');
      return normHousehold(rows[0]);
    },

    /**
     * Renames the signed-in member.
     * @param {string} displayName 1 to 24 characters.
     * @returns {Promise<Object>} The updated Member.
     */
    updateMyName: async function (displayName) {
      var name = cleanName(displayName);
      var userId = await currentUserId();
      var res = await call(requireClient().from('members').update({ display_name: name })
        .eq('user_id', userId).select(MEMBER_FIELDS.join(',')));
      var rows = res.data || [];
      if (!rows.length) throw fail('NOT_MEMBER');
      return normMember(rows[0]);
    },

    /**
     * Opens the single 'duo-sync' realtime channel. Replaces any previous subscription.
     * Statuses: 'connecting', 'live', 'reconnecting' (retrying with 1,2,4…30 s backoff), 'offline'.
     * @param {{onExpense?:Function, onIncome?:Function, onBudget?:Function, onHousehold?:Function,
     *   onMember?:Function, onActivity?:Function, onStatus?:function(string):void}} handlers
     * @returns {function():void} Unsubscribe function (also cancels pending retries).
     */
    subscribe: function (handlers) {
      requireClient();
      var disposing = active ? stopSubscription(active) : null;
      var state = {
        handlers: handlers || {},
        stopped: false,
        attempt: 0,
        gen: 0,
        retryTimer: null,
        att: null,
        onOnline: null,
        onOffline: null
      };
      state.onOnline = function () {
        if (state.stopped) return;
        if (state.retryTimer) {
          clearTimeout(state.retryTimer);
          state.retryTimer = null;
        }
        state.attempt = 0;
        emitStatus(state, 'reconnecting');
        openChannel(state);
      };
      state.onOffline = function () {
        emitStatus(state, 'offline');
      };
      root.addEventListener('online', state.onOnline);
      root.addEventListener('offline', state.onOffline);
      active = state;
      emitStatus(state, 'connecting');
      if (disposing) {
        disposing.then(function () { openChannel(state); });
      } else {
        openChannel(state);
      }
      return function () {
        stopSubscription(state);
      };
    },

    /**

language sql stable security definer set search_path = public as $$

create or replace function public.household_status() returns jsonb
language sql stable security definer set search_path = public as $$
  select jsonb_build_object(

    'my_slot',      (select slot from public.members where user_id = auth.uid())

create or replace function public.create_household(p_passphrase text, p_display_name text, p_currency text default '€')
returns text language plpgsql security definer set search_path = public, extensions as $$
begin
  if auth.uid() is null then raise exception 'DUO_NOT_AUTHENTICATED'; end if;
  if exists (select 1 from public.household_secret) then raise exception 'DUO_HOUSEHOLD_EXISTS'; end if;
  if p_passphrase is null or char_length(p_passphrase) < 8 then raise exception 'DUO_PASSPHRASE_TOO_SHORT'; end if;
  if p_display_name is null or char_length(trim(p_display_name)) not between 1 and 24 then raise exception 'DUO_BAD_NAME'; end if;
  insert into public.household_secret (id, passphrase_hash) values (1, crypt(p_passphrase, gen_salt('bf', 10)));
  update public.household set currency = coalesce(nullif(trim(p_currency), ''), '€') where id = 1;
  insert into public.members (user_id, slot, display_name) values (auth.uid(), 'A', trim(p_display_name));
  return 'A';
end $$;

create or replace function public.join_household(p_passphrase text, p_display_name text)
returns text language plpgsql security definer set search_path = public, extensions as $$
declare v_hash text; v_slot text;
begin
  if auth.uid() is null then raise exception 'DUO_NOT_AUTHENTICATED'; end if;
  select slot into v_slot from public.members where user_id = auth.uid();
  if v_slot is not null then return v_slot; end if;
  if (select count(*) from public.join_attempts where user_id = auth.uid() and at > now() - interval '15 minutes') >= 5 then
    raise exception 'DUO_TOO_MANY_ATTEMPTS';
  end if;
  -- Global cap too, so creating many throwaway accounts doesn't help guess the passphrase
  if (select count(*) from public.join_attempts where at > now() - interval '15 minutes') >= 20 then
    raise exception 'DUO_TOO_MANY_ATTEMPTS';
  end if;
  insert into public.join_attempts (user_id) values (auth.uid());
  select passphrase_hash into v_hash from public.household_secret where id = 1;
  if v_hash is null then raise exception 'DUO_NO_HOUSEHOLD'; end if;
  -- Wrong passphrase RETURNS (not raises) so the attempt row above is committed and counted.
  if crypt(p_passphrase, v_hash) <> v_hash then return 'DUO_WRONG_PASSPHRASE'; end if;
  if exists (select 1 from public.members where slot = 'B') then raise exception 'DUO_HOUSEHOLD_FULL'; end if;
  if p_display_name is null or char_length(trim(p_display_name)) not between 1 and 24 then raise exception 'DUO_BAD_NAME'; end if;
  insert into public.members (user_id, slot, display_name) values (auth.uid(), 'B', trim(p_display_name));
  delete from public.join_attempts where user_id = auth.uid();
  return 'B';
end $$;

-- ───────────── Server-side stamping (cannot be spoofed by the client) ─────────────
create or replace function public.stamp_row() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  if tg_op = 'INSERT' then
    new.created_by := auth.uid();
    new.created_at := now();
    new.updated_by := null; new.updated_at := null;
    new.deleted_by := null; new.deleted_at := null;
  else
    new.created_by := old.created_by;
    new.created_at := old.created_at;
    new.updated_by := auth.uid();
    new.updated_at := now();
    if old.deleted_at is null and new.deleted_at is not null then
      new.deleted_by := auth.uid(); new.deleted_at := now();
    elsif new.deleted_at is null then
      new.deleted_by := null;
    else
      new.deleted_by := old.deleted_by; new.deleted_at := old.deleted_at;
    end if;
  end if;
  return new;
end $$;

create or replace function public.stamp_updated() returns trigger
language plpgsql security definer set search_path = public as $$
begin
  new.updated_by := auth.uid();
  new.updated_at := now();
  return new;
end $$;

create or replace function public.log_change() returns trigger
language plpgsql security definer set search_path = public as $$
declare v_new jsonb; v_old jsonb; v_action text; v_row jsonb; v_id text;
begin
  v_new := case when tg_op <> 'DELETE' then to_jsonb(new) end;
  v_old := case when tg_op <> 'INSERT' then to_jsonb(old) end;
  if tg_op = 'INSERT' then v_action := 'add';
  elsif tg_op = 'DELETE' then v_action := 'delete';
  elsif (v_old->>'deleted_at') is null and (v_new->>'deleted_at') is not null then v_action := 'delete';
  elsif (v_old->>'deleted_at') is not null and (v_new->>'deleted_at') is null then v_action := 'restore';
  else v_action := 'edit';
  end if;
  v_row := coalesce(v_new, v_old);
  v_id  := coalesce(v_row->>'id', v_row->>'user_id', (v_row->>'category') || '@' || (v_row->>'effective_from'));
  insert into public.activity_log (actor, entity, action, entity_id, data)
  values (auth.uid(), tg_table_name, v_action, v_id,
          jsonb_build_object('new', v_new, 'old', case when v_action = 'edit' then v_old end));
  return coalesce(new, old);
end $$;

/* ───────────── routing / lifecycle ───────────── */
function hookAuth() {
  if (unsubAuth) unsubAuth();
  unsubAuth = S.onAuthChange(onAuth);
}
function onAuth(ev) {
  if (ev === 'PASSWORD_RECOVERY') {
    recovering = true;
    routeSeq++;
    teardown();
    showRecovery();
  } else if (ev === 'SIGNED_OUT') {
    routeSeq++;
    if (state.session) { teardown(); resetState(); showAuth(); }
  } else if (ev === 'SIGNED_IN') {
    if (!authBusy && !state.session && !recovering && state.screen === 'auth') route();
  }
}
function teardown() {
  if (unsubStore) { unsubStore(); unsubStore = null; }
  state.me = null; state.loaded = false;
}
function resetState() {
  state.session = null; state.me = null; state.loaded = false;
  state.members = { A: null, B: null };
  state.expenses = new Map(); state.incomes = new Map(); state.budgetRows = []; state.activity = [];
  state.cycleStart = null; state.pwOpen = false; state.tab = 'home'; state.actView = 'spending'; state.status = 'connecting';
  pending.clear(); sending.clear(); needCatchUp = false;
}
async function route() {
  var seq = ++routeSeq;
  if (recovering) return showRecovery();
  showLoading();
  try {
    var sess = await S.getSession();
    if (seq !== routeSeq || recovering) return;
    if (!sess) { state.session = null; return showAuth(); }
    state.session = sess;
    var hs = await S.householdStatus();
    if (seq !== routeSeq || recovering) return;
    if (!hs.exists) return showCreate();
    if (!hs.my_slot) return showJoin(hs);
    await enterApp(hs.my_slot, seq);
  } catch (err) {
    if (seq !== routeSeq || recovering) return;
    if (err && err.code === 'AUTH') { state.session = null; return showAuth({}); }
    showFatal(errText(err));
  }
}
function applyLoaded(d) {
  var members = { A: null, B: null };
  d.members.forEach(function (m) { members[m.slot] = { userId: m.user_id, name: m.display_name }; });
  state.members = members;
  if (d.household) state.household = { currency: d.household.currency, cycle_starter: d.household.cycle_starter };
  state.expenses = mergeMap(state.expenses, d.expenses);
  state.incomes = mergeMap(state.incomes, d.incomes);
  state.budgetRows = d.budgetRows.slice();
  state.activity = d.activity.slice(0, 200);
}
function mergeMap(old, rows) {
  var next = new Map();
  rows.forEach(function (r) { next.set(r.id, r); });
  pending.forEach(function (id) { if (old.has(id)) next.set(id, old.get(id)); });
  return next;
}
async function enterApp(slot, seq) {
  var d = await S.loadAll({ sinceDate: L.addDays(L.todayISO(), -400) });
  if (seq !== routeSeq || recovering) return;
  state.me = slot;
  applyLoaded(d);
  state.loaded = true;
  state.screen = 'app';
  state.status = 'connecting';
  mountShell();
  startRealtime();
  animateBars = true;
  render();
}
function startRealtime() {
  if (unsubStore) unsubStore();
  needCatchUp = true;
  unsubStore = S.subscribe({
    onExpense: function (e) { rtCount++; if (!pending.has(e.id)) { state.expenses.set(e.id, e); render(); } },
    onIncome: function (i) { rtCount++; if (!pending.has(i.id)) { state.incomes.set(i.id, i); render(); } },
    onBudget: function (b) {
      rtCount++;
      state.budgetRows = state.budgetRows.filter(function (r) { return !(r.category === b.category && r.effective_from === b.effective_from); });
      state.budgetRows.push(b);
      render();
    },
    onHousehold: function (hh) { rtCount++; state.household = { currency: hh.currency, cycle_starter: hh.cycle_starter }; render(); },
    onMember: function (m) { rtCount++; state.members[m.slot] = { userId: m.user_id, name: m.display_name }; render(); },
    onActivity: function (a) {
      rtCount++;
      if (state.activity.some(function (x) { return x.id === a.id; })) return;
      state.activity.unshift(a);
      if (state.activity.length > 200) state.activity.length = 200;
      render();
    },
    onStatus: function (s) {
      if (s === 'reconnecting' || s === 'offline') needCatchUp = true;
      else if (s === 'live' && needCatchUp) { needCatchUp = false; catchUp(); }
      state.status = s;
      updateChrome();
    }
  });
}
async function catchUp(pass) {
  if (catching || !state.me || !state.session) return;
  catching = true;
  var again = false;
  try {
    var c0 = rtCount;
    applyLoaded(await S.loadAll({ sinceDate: L.addDays(L.todayISO(), -400) }));
    render();
    if (rtCount !== c0 && (pass || 0) < 2) again = true;
  } catch (err) {
    if (err && (err.code === 'AUTH' || err.code === 'NOT_MEMBER')) showToast({ text: errText(err) });
  } finally {
    catching = false;
  }
  if (again) catchUp((pass || 0) + 1);
}
function resume() {
  if (!state.me || !state.session) return;
  if (state.status !== 'live') startRealtime();
  catchUp();
}
async function doSignOut() {
  teardown();
  var had = state.session;
  resetState();
  try { if (had) await S.signOut(); } catch (e) { /* signing out locally anyway */ }
  route();
}
async function changeDatabase() {
  if (!window.confirm('Disconnect from this database? You will be signed out on this device.')) return;
  LS.del('duo.config');
  teardown();
  resetState();
  state.config = null;
  if (unsubAuth) { unsubAuth(); unsubAuth = null; }
  try { await S.signOut(); } catch (e) { /* already signed out */ }
  try { S.disconnect(); } catch (e) { /* nothing to disconnect */ }
  showSetupDb();
}

function updateChrome() {

  av.textContent = String(slotName(state.me) || '?').trim().charAt(0).toUpperCase();
  av.style.setProperty('--c', slotVar(state.me));
  $('#avatar').setAttribute('aria-label', 'Settings, signed in as ' + slotName(state.me));
  document.querySelectorAll('#tabbar .tab').forEach(function (b) {
    if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}
function keyOf(el) {
  var d = el.dataset;
  return (d.act || d.field || '') + '|' + (d.id || d.v || d.tab || d.cat || d.dir || '');
}
function render() {
  if (!state.me || !$('#main')) return;
  updateChrome();
  var main = $('#main');
  var ae = document.activeElement;
  if (ae && main.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) { deferredMain = true; return; }
  deferredMain = false;
  var key = (ae && main.contains(ae)) ? keyOf(ae) : null;
  var v = computeView();
  var html;
  if (state.tab === 'home') html = homeHtml(v);
  else if (state.tab === 'activity') html = activityHtml(v);
  else if (state.tab === 'income') html = incomeHtml(v);
  else html = settingsHtml(v);
  main.innerHTML = '<div class="stack" style="padding-top:8px">' + html + '</div>';
  if (key) {
    var again = Array.prototype.find.call(main.querySelectorAll('[data-act],[data-field]'), function (el) { return keyOf(el) === key; });
    if (again) again.focus({ preventScroll: true });
  }
  if (animateBars) {
    animateBars = false;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        main.querySelectorAll('.bar > i[data-w]').forEach(function (i) { i.style.width = i.dataset.w + '%'; });
      });
    });
  }
}
function goTab(t) {
  if (state.tab === t) return;
  state.tab = t;
  animateBars = true;
  render();
  window.scrollTo(0, 0);
}

/* ───────────── shared view pieces ───────────── */

  return '<div class="' + cls + '" style="' + (color ? '--c:' + color : '') + '" aria-hidden="true"><i data-w="' + w.toFixed(1) + '" style="width:' + (animateBars ? 0 : w.toFixed(1)) + '%"></i></div>';

function switcher(v) {

async function commitBudget(inp) {
  var cat = inp.dataset.cat;
  var v = computeView();
  var start = v.cycles[0].start;
  var curVal = L.resolveBudgets(state.budgetRows, v.cycles[0])[cat];
  var val = L.parseAmount(inp.value);
  if (isNaN(val) || val < 0 || val >= 1e10) {
    inp.value = fmtInput(curVal);
    return showToast({ text: 'Please enter a valid amount.' });
  }
  inp.value = fmtInput(val);
  if (val === curVal) return;
  var prev = state.budgetRows.slice();
  state.budgetRows = state.budgetRows.filter(function (r) { return !(r.category === cat && r.effective_from === start); });
  state.budgetRows.push({ category: cat, effective_from: start, amount: val, updated_by: state.session.userId, updated_at: nowISO() });
  try {
    await S.setBudget({ category: cat, effectiveFrom: start, amount: val });
    buzz();
  } catch (err) {
    state.budgetRows = prev;
    inp.value = fmtInput(curVal);
    showToast({ text: errText(err) });
  }
}
async function commitCurrency(inp) {
  var val = inp.value.trim();
  var prev = state.household.currency;
  if (!val || val.length > 4) { inp.value = prev; return showToast({ text: 'Use 1 to 4 characters for the symbol.' }); }
  if (val === prev) return;
  state.household = Object.assign({}, state.household, { currency: val });
  try { await S.updateHousehold({ currency: val }); buzz(); }
  catch (err) { state.household = Object.assign({}, state.household, { currency: prev }); inp.value = prev; showToast({ text: errText(err) }); }
}
async function commitName(inp) {
  var val = inp.value.trim();
  var prev = state.members[state.me];
  if (!val || val.length > 24) { inp.value = prev.name; return showToast({ text: 'Names can be 1 to 24 characters.' }); }
  if (val === prev.name) return;
  state.members[state.me] = { userId: prev.userId, name: val };
  try { await S.updateMyName(val); buzz(); }
  catch (err) { state.members[state.me] = prev; inp.value = prev.name; showToast({ text: errText(err) }); }
}
async function setStarter(val) {
  var prev = state.household.cycle_starter;
  if (val === prev) return;
  state.household = Object.assign({}, state.household, { cycle_starter: val });
  render();
  try { await S.updateHousehold({ cycle_starter: val }); buzz(); }
  catch (err) { state.household = Object.assign({}, state.household, { cycle_starter: prev }); render(); showToast({ text: errText(err) }); }
}

/* ───────────── writes: expenses / incomes ───────────── */
var RETRY_MS = [2000, 4000, 8000];
async function sendWithRetry(id, attempt) {
  for (var i = 0; ; i++) {
    try {
      return await attempt();
    } catch (err) {
      if (!(err && err.code === 'NETWORK') || i >= RETRY_MS.length) throw err;
      if (!sending.has(id)) { sending.add(id); render(); }
      await new Promise(function (r) { setTimeout(r, RETRY_MS[i]); });
      if (!state.session) throw err;
    }
  }
}
async function addExpenseOptimistic(row) {
  state.expenses.set(row.id, row);
  pending.add(row.id);
  render();
  try {
    var res = await sendWithRetry(row.id, function () {
      return S.addExpense({ id: row.id, amount: row.amount, category: row.category, description: row.description, spent_on: row.spent_on, paid_by: row.paid_by });
    });
    if (res && res.id) state.expenses.set(res.id, res);
    buzz();
    showToast({ text: 'Added ' + money(row.amount) + ' · ' + L.CATEGORY_LABEL[row.category], ms: 3000 });
  } catch (err) {
    state.expenses.delete(row.id);
    showToast({ text: errText(err) });
  } finally {
    pending.delete(row.id); sending.delete(row.id);
    render();
  }
}
async function addIncomeOptimistic(row) {
  state.incomes.set(row.id, row);
  pending.add(row.id);
  render();
  try {
    var res = await sendWithRetry(row.id, function () {
      return S.addIncome({ id: row.id, amount: row.amount, earner: row.earner, label: row.label, received_on: row.received_on, starts_cycle: row.starts_cycle });
    });
    if (res && res.id) state.incomes.set(res.id, res);
    buzz();
    showToast({ text: 'Logged ' + money(row.amount) + ' · ' + row.label, ms: 3000 });
  } catch (err) {
    state.incomes.delete(row.id);
    showToast({ text: errText(err) });
  } finally {
    pending.delete(row.id); sending.delete(row.id);
    render();
  }
}
async function setDeleted(kind, id, deleted) {
  var map = kind === 'expenses' ? state.expenses : state.incomes;
  var prev = map.get(id);
  if (!prev) return false;
  map.set(id, Object.assign({}, prev, { deleted_at: deleted ? nowISO() : null, deleted_by: deleted ? state.session.userId : null }));
  pending.add(id);
  render();
  var ok = true;
  try {
    var name = (kind === 'expenses' ? (deleted ? 'deleteExpense' : 'restoreExpense') : (deleted ? 'deleteIncome' : 'restoreIncome'));
    var res = await S[name](id);
    if (res && typeof res === 'object' && res.id === id) map.set(id, res);
    buzz();
  } catch (err) {
    ok = false;
    map.set(id, prev);
    showToast({ text: errText(err) });
  } finally {
    pending.delete(id);
    render();
  }
  return ok;
}
async function deleteWithUndo(kind, id) {
  if (await setDeleted(kind, id, true)) {
    showToast({ text: kind === 'expenses' ? 'Expense deleted' : 'Income deleted', action: 'Undo', onAction: function () { setDeleted(kind, id, false); } });
  }
}

      '<select class="input" style="margin-top:10px" data-sh="category" aria-label="Category">' +
      L.CATEGORIES.map(function (c) { return '<option value="' + c.key + '"' + (sh.category === c.key ? ' selected' : '') + '>' + h(c.label) + '</option>'; }).join('') + '</select></div>' +
      field('sh-desc', 'Description', '<input id="sh-desc" class="input" maxlength="140" autocomplete="off" placeholder="What was it for? (optional)" data-sh="description" value="' + h(sh.description) + '">') +
      field('sh-date', 'Date', '<input id="sh-date" class="input" type="date" data-sh="date" value="' + h(sh.date) + '">') +
      '<div><p class="lbl">Who paid?</p>' + partnerSeg('Who paid?', 'sheet-who', sh.paidBy) + '</div>';
  } else {
    body =
      '<div><p class="lbl">Who earned it?</p>' + partnerSeg('Who earned it?', 'sheet-earner', sh.earner) + '</div>' +
      field('sh-label', 'Label', '<input id="sh-label" class="input" maxlength="40" autocomplete="off" placeholder="Salary" data-sh="label" value="' + h(sh.label) + '">') +
      field('sh-date', 'Received on', '<input id="sh-date" class="input" type="date" data-sh="date" value="' + h(sh.date) + '">') +
      '<button type="button" class="switch-row" role="switch" aria-checked="' + sh.startsCycle + '" data-act="sheet-starts"><span>Starts a new budget cycle</span><span class="switch"><i></i></span></button>';
  }
  return '<div class="sheet-grab" data-grab><span class="grab-handle"></span>' +
    '<button type="button" class="iconbtn sheet-x" data-act="close-sheet" aria-label="Close">' + ico('close', 22) + '</button></div>' +
    '<div style="padding:0 20px 12px">' + segHtml('What are you adding?', [['expense', 'Expense'], ['income', 'Income']], sh.mode, 'sheet-mode') + '</div>' +
    '<form id="sheet-form" data-form="sheet" novalidate class="form" style="padding:0 20px 12px">' +
    '<div><label class="lbl" for="sh-amount">Amount</label><div class="amount-wrap"><span class="cur" aria-hidden="true">' + h(state.household.currency) + '</span>' +
    '<input id="sh-amount" class="amount-input" inputmode="decimal" autocomplete="off" placeholder="0.00" data-sh="amount" aria-describedby="sh-err" value="' + h(sh.amount) + '"></div>' +
    '<p id="sh-err" class="err" role="alert">' + h(sh.error) + '</p></div>' +
    body + '<button type="submit" class="btn">' + (ex ? 'Add expense' : 'Add income') + '</button></form>';
}
function renderSheet() {
  var inner = $('#sheet-inner');
  if (!inner) return;
  var ae = document.activeElement;
  var key = ae && inner.contains(ae) ? (ae.id ? '#' + ae.id : keyOf(ae)) : null;
  var chips = $('.chips', inner);
  var sl = chips ? chips.scrollLeft : 0;
  inner.innerHTML = sheetHtml();
  $('#sheet').setAttribute('aria-label', sh.mode === 'expense' ? 'Add expense' : 'Add income');
  var c2 = $('.chips', inner);
  if (c2) c2.scrollLeft = sl;
  if (key) {
    var el = key.charAt(0) === '#' ? $(key, inner) : Array.prototype.find.call(inner.querySelectorAll('[data-act]'), function (x) { return keyOf(x) === key; });
    if (el) el.focus({ preventScroll: true });
  }
}
function openSheet(mode) {
  if (sh) return;
  lastFocus = document.activeElement;
  sh = newSheet(mode);
  var root = $('#sheet-root');
  root.innerHTML = '<div class="sheet-backdrop" data-act="close-sheet"></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add expense"><div id="sheet-inner"></div></div>';
  root.hidden = false;
  renderSheet();
  $('#app').setAttribute('inert', '');
  requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add('open'); }); });
  setTimeout(function () { var a = $('#sh-amount'); if (a) a.focus({ preventScroll: true }); }, 80);
}
function closeSheet(returnFocus) {
  var root = $('#sheet-root');
  if (!sh || !root) { sh = null; if (root) { root.hidden = true; root.innerHTML = ''; } return; }
  sh = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.classList.remove('open');
  $('#app').removeAttribute('inert');
  var done = function () {
    if (sh) return;
    root.hidden = true; root.innerHTML = '';
  };
  if (reduce) done(); else setTimeout(done, 330);
  if (returnFocus !== false) {
    var target = lastFocus && document.contains(lastFocus) ? lastFocus : $('#fab');
    if (target) target.focus({ preventScroll: true });
  }
}
function sheetError(msg, id) {
  sh.error = msg;
  var e = $('#sh-err');
  if (e) e.textContent = msg;
  var a = $(id || '#sh-amount');
  if (a) a.focus({ preventScroll: true });
}
function submitSheet() {
  var amt = L.parseAmount(sh.amount);
  if (isNaN(amt) || !(amt > 0)) return sheetError('Enter an amount above 0.');
  if (amt >= 1e10) return sheetError('That amount is too large.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(sh.date)) return sheetError('Please pick a date.', '#sh-date');
  var uid = state.session.userId, now = nowISO();
  var base = { id: uuid(), amount: amt, created_by: uid, created_at: now, updated_by: null, updated_at: null, deleted_by: null, deleted_at: null };
  if (sh.mode === 'expense') {
    var row = Object.assign(base, { category: sh.category, description: sh.description.trim().slice(0, 140), spent_on: sh.date, paid_by: sh.paidBy, source: 'manual' });
    LS.set('duo.lastCategory', sh.category);
    closeSheet();
    addExpenseOptimistic(row);
  } else {
    var label = sh.label.trim();
    if (!label) return sheetError('Add a short label, like Salary.', '#sh-label');
    var inc = Object.assign(base, { earner: sh.earner, label: label.slice(0, 40), received_on: sh.date, starts_cycle: sh.startsCycle });
    closeSheet();
    addIncomeOptimistic(inc);
  }
}
function trapFocus(e) {
  var dlg = $('#sheet');
  if (!dlg) return;
  var f = Array.prototype.filter.call(dlg.querySelectorAll('button, input, select, textarea, [href], [tabindex]:not([tabindex="-1"])'), function (el) { return !el.disabled && el.offsetParent !== null; });
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || !dlg.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (document.activeElement === last || !dlg.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
}

/* swipe-down to close */
(function () {
  var drag = null;
  document.addEventListener('pointerdown', function (e) {
    var g = e.target.closest ? e.target.closest('[data-grab]') : null;
    if (!g || !sh || e.target.closest('button')) return;
    drag = { y: e.clientY, dy: 0, t: Date.now(), id: e.pointerId, g: g };
    try { g.setPointerCapture(e.pointerId); } catch (err) { return; }
    $('#sheet').style.transition = 'none';
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dy = Math.max(0, e.clientY - drag.y);
    $('#sheet').style.transform = 'translate(-50%, ' + drag.dy + 'px)';
  });
  function end(e) {
    if (!drag || e.pointerId !== drag.id) return;
    var d = drag; drag = null;
    var s = $('#sheet');
    if (!s) return;
    s.style.transition = ''; s.style.transform = '';
    var fast = d.dy / Math.max(1, Date.now() - d.t) > 0.6;
    if (d.dy > 90 || (fast && d.dy > 30)) closeSheet();
  }
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

/* ───────────── copy helper ───────────── */
async function copyText(text, btn) {
  var ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
  }
  var span = btn.querySelector('span');
  if (span) {
    span.textContent = ok ? 'Copied' : 'Select and copy manually';
    setTimeout(function () { if (span.isConnected) span.textContent = 'Copy SQL'; }, 2200);
  }
}

/* ───────────── events ───────────── */
var ACTIONS = {
  goto: function (t) { goTab(t.dataset.tab); },
  cycle: function (t) {
    var v = computeView();
    var idx = Math.max(0, Math.min(v.cycles.length - 1, v.index + Number(t.dataset.dir)));
    state.cycleStart = idx === 0 ? null : v.cycles[idx].start;
    animateBars = true; render();
  },
  'pw-toggle': function () { state.pwOpen = !state.pwOpen; render(); },
  actview: function (t) { state.actView = t.dataset.v; render(); },
  'open-sheet': function (t) { openSheet(t.dataset.mode); },
  'close-sheet': function () { closeSheet(); },
  'sheet-mode': function (t) {
    sh.mode = t.dataset.v; sh.error = '';
    if (sh.mode === 'income' && !sh.startsTouched) sh.startsCycle = L.defaultStartsCycle(state.household.cycle_starter, sh.earner);
    renderSheet();
    $('#sheet').scrollTop = 0;
  },
  'sheet-cat': function (t) { sh.category = t.dataset.v; renderSheet(); },
  'sheet-who': function (t) { sh.paidBy = t.dataset.v; renderSheet(); },
  'sheet-earner': function (t) {
    sh.earner = t.dataset.v;
    if (!sh.startsTouched) sh.startsCycle = L.defaultStartsCycle(state.household.cycle_starter, sh.earner);
    renderSheet();
  },
  'sheet-starts': function () { sh.startsTouched = true; sh.startsCycle = !sh.startsCycle; renderSheet(); },
  del: function (t) { deleteWithUndo(t.dataset.ent, t.dataset.id); },
  restore: function (t) {
    setDeleted(t.dataset.ent, t.dataset.id, false).then(function (ok) { if (ok) showToast({ text: 'Restored', ms: 3000 }); });
  },
  starter: function (t) { setStarter(t.dataset.v); },
  signout: function () { doSignOut(); },
  'change-db': function () { changeDatabase(); },
  'copy-sql': function (t) { copyText(S.SCHEMA_SQL, t); },
  'auth-mode': function (t) { showAuth({ mode: t.dataset.v }); },
  cur: function (t) { var i = $('#cr-cur'); if (i) i.value = t.dataset.v; },
  retry: function () { route(); },
  'toast-action': function () { var fn = toastAction; hideToast(); if (fn) fn(); }
};
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t || t.disabled) return;
  var fn = ACTIONS[t.dataset.act];
  if (fn) fn(t, e);
});
var FORMS = {
  connect: connectDb, signin: onSignin, signup: onSignup, forgot: onForgot, recover: onRecover, chgpw: onChangePw,
  create: onCreate, join: onJoin, sheet: function () { if (sh) submitSheet(); }
};
document.addEventListener('submit', function (e) {
  var f = e.target.closest ? e.target.closest('form[data-form]') : null;
  if (!f) return;
  e.preventDefault();
  var fn = FORMS[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('input', function (e) {
  var el = e.target;
  if (!sh || !el.dataset || !el.dataset.sh) return;
  var k = el.dataset.sh;
  if (k === 'category') { sh.category = el.value; return; }
  sh[k] = el.value;
  if (sh.error) { sh.error = ''; var er = $('#sh-err'); if (er) er.textContent = ''; }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (!el.dataset) return;
  if (el.dataset.sh === 'category' && sh) { sh.category = el.value; renderSheet(); return; }
  if (el.dataset.field === 'budget') commitBudget(el);
  else if (el.dataset.field === 'currency') commitCurrency(el);
  else if (el.dataset.field === 'myname') commitName(el);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && sh) { e.preventDefault(); closeSheet(); return; }
  if (e.key === 'Tab' && sh) { trapFocus(e); return; }
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.field) { e.preventDefault(); e.target.blur(); }
});
document.addEventListener('focusout', function () {
  if (!deferredMain) return;
  setTimeout(function () {
    var ae = document.activeElement, main = $('#main');
    if (main && !(ae && main.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName))) render();
  }, 0);
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') resume(); });
window.addEventListener('online', function () { resume(); });

/* ───────────── boot ───────────── */
async function boot() {
  var hp = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  var hashErr = hp.get('error_description') || hp.get('error_code') || hp.get('error');
  if (hashErr) {
    linkError = 'That link has expired \u2014 request a new one.';
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* no history access */ }
  }
  recovering = !hashErr && /type=recovery/.test(location.hash);
  showLoading();
  var cfg = loadConfig();
  if (!cfg) return showSetupDb();
  state.config = cfg;
  try {
    await S.connect({ url: cfg.url, anonKey: cfg.anonKey });
    await S.checkSchema();
  } catch (err) {
    if (err && err.code === 'SCHEMA') return showSetupDb({ url: cfg.url, anonKey: cfg.anonKey, schema: true });
    return showSetupDb({ url: cfg.url, anonKey: cfg.anonKey, error: errText(err) });
  }
  hookAuth();
  route();
}
boot();
})();
